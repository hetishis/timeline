<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>My Life Timeline</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="site-header__inner">
      <span class="site-header__title">🗓️ My Life Timeline</span>
      <span class="site-header__hint">today at the top &middot; click an entry to expand &middot; add your own below</span>
    </div>
    <div class="progress-bar"><div class="progress-bar__fill" id="progressFill"></div></div>
  </header>

  <main>
    <section class="intro">
      <h1>Working backward from today.</h1>
      <p>Every month since January 2023, newest first. Click any entry to read more, edit it, or remove it &mdash; and drop in moments of your own as you go.</p>
    </section>

    <div class="legend" id="legend"></div>

    <div class="timeline" id="timeline">
      <div class="timeline__line"></div>
      <div class="timeline__line-fill" id="lineFill"></div>
      <div class="timeline__nodes" id="nodes"></div>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
