<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>My Life Timeline</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="site-header__row">
      <span class="site-header__title">🗓️ My Life Timeline</span>
      <span class="site-header__hint">scroll to move through time, day by day</span>
    </div>
    <div class="legend" id="legend"></div>
    <div class="active-year" id="activeYear"></div>
    <div class="progress-bar"><div class="progress-bar__fill" id="progressFill"></div></div>
  </header>

  <div class="stage" id="stage" tabindex="0" aria-label="Life timeline, scroll or use arrow keys to move through time">
    <div class="stage__line"></div>
    <div class="stage__playhead"></div>
    <div class="stage__content" id="content"></div>
  </div>

  <div class="year-rail" id="yearRail" aria-label="Jump to a year">
    <div class="year-rail__line"></div>
    <div class="year-rail__marks" id="yearRailMarks"></div>
    <div class="year-rail__cursor" id="yearRailCursor"></div>
  </div>

  <footer class="date-bar">
    <div class="date-bar__date" id="dateBarDate">&nbsp;</div>
    <button class="add-fab" id="addFab" type="button" aria-label="Add an event">+</button>
  </footer>

  <div class="add-panel" id="addPanel" hidden>
    <div class="add-panel__inner">
      <div class="add-panel__head">
        <strong>Add an event</strong>
        <button type="button" class="add-panel__close" data-action="close-add" aria-label="Close">&times;</button>
      </div>
      <form class="event-form" id="addForm" data-mode="add"></form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
